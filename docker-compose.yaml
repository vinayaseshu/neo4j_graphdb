version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: my_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP/Neo4j Browser
      - "7687:7687" # Bolt connection
    environment:
      - NEO4J_AUTH=neo4j/Welcome#2468
      # Recommended memory tuning configurations
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache_size=512m
      # Install plugins (like APOC) automatically
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
